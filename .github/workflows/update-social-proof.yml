name: Update social-proof stats

on:
  schedule:
    # ~05:15 UTC daily
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RevenueCat trials (last 7d)
        env:
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
        run: node scripts/update-social-proof.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/stats/social-proof.json
          if git diff --staged --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Update social-proof stats from RevenueCat"
          git push
